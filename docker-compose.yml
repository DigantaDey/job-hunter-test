# Development topology: hot-reload API + Vite dev server with HMR.
#
#   docker compose up --build
#
# For a production-like stack (PostgreSQL, migrations, standalone worker) use
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  backend:
    build:
      context: ./backend
      args:
        # Assisted Apply needs Playwright + Chromium inside the image; set to
        # "0" for the minimal dev image.
        WITH_AUTOFILL: "1"
        # Local decision engine (Laya): set to "1" to bake it (plus its model
        # weights) into the dev image; LAYA_WARMUP=0 skips the baked weights.
        WITH_LAYA: "${WITH_LAYA:-0}"
        LAYA_WARMUP: "${LAYA_WARMUP:-1}"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/jobhunter.db
      UPLOAD_DIR: /app/data/uploads
      GENERATED_DIR: /app/data/generated
      SCREENSHOT_DIR: /app/data/screenshots
      # The dev stack ships the browser, automation on but still dry-run —
      # submissions stay a conscious operator decision.
      AUTOFILL_ENABLED: "true"
      # Assisted Apply opens a *visible* browser. On a Linux desktop the X
      # socket below plus this DISPLAY make the window appear on the host; with
      # neither set the launcher resolves to headless and the UI says so.
      DISPLAY: ${DISPLAY:-}
    volumes:
      - ./backend:/app
      - backend-data:/app/data
      # Harmless on macOS/Windows (an empty directory is created, DISPLAY is
      # unset, so the run is headless there).
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      # Inside the compose network the backend is reachable as "backend".
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    command: npm run dev

volumes:
  backend-data:
