# Single-node production topology: PostgreSQL + API + pipeline worker.
#
#   cp .env.example .env        # fill in SECRET_KEY, ENCRYPTION_KEY, AI key…
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The API serves the built SPA and the JSON API on one port, so a reverse proxy
# (or a platform load balancer) only has to terminate TLS in front of :8000.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobhunter}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the app network reaches the database.
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}
      ENVIRONMENT: production
      RUN_WORKER_IN_API: "false"
      AUTO_MIGRATE: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/backend/uploads
      - generated:/app/backend/generated
      - screenshots:/app/backend/artifacts/screenshots
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}
      ENVIRONMENT: production
      # A standalone worker must not run its own API; the API container never
      # runs pipelines. One place to look when a queue backs up.
      RUN_WORKER_IN_API: "false"
      WORKER_CONCURRENCY: "2"
    volumes:
      - uploads:/app/backend/uploads
      - generated:/app/backend/generated
      - screenshots:/app/backend/artifacts/screenshots

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ops"]
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/backup.py", "--out", "/backups", "--keep", "14"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}
    volumes:
      - backups:/backups

volumes:
  db-data:
  uploads:
  generated:
  screenshots:
  backups:
