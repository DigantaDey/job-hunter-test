# Single-node production topology: PostgreSQL + API + pipeline worker.
#
#   cp .env.example .env        # fill in SECRET_KEY, ENCRYPTION_KEY, AI key…
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The API serves the built SPA and the JSON API on one port, so a reverse proxy
# (or a platform load balancer) only has to terminate TLS in front of :8000.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobhunter}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the app network reaches the database.
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Assisted Apply's browser ships with the deployment by default.
        WITH_AUTOFILL: "${WITH_AUTOFILL:-1}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}
      ENVIRONMENT: production
      RUN_WORKER_IN_API: "false"
      # One API process. Every budget the app enforces is in-process state — the
      # rate limiter, AI token buckets and daily budgets, per-user AI overrides,
      # the metrics registry — so WEB_CONCURRENCY=N would silently multiply each
      # per-user limit by N and make a setting saved through the API reach one
      # worker in N. Scale by adding replicas of this service behind a load
      # balancer (and workers below), not by raising this. docs/DEPLOYMENT.md §6.
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      # Client-IP trust boundary: name the proxy that sets X-Forwarded-For, or
      # leave the loopback default and forwarded headers are ignored (the peer
      # address is the client). Set both to the same value — uvicorn's
      # --proxy-headers reads FORWARDED_ALLOW_IPS, the app's own resolver (rate
      # limits, audit IPs) reads TRUSTED_PROXIES. '*' is refused in production.
      #   proxy on the docker host:  172.17.0.1 (or your gateway)
      #   proxy in this network:     172.18.0.0/16
      #   cloud LB:                  its subnet, e.g. 10.0.0.0/8
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      AUTO_MIGRATE: "true"
      # Metrics on their own port, reachable only inside this compose network
      # (0.0.0.0 inside the container, never published to the host).
      METRICS_PORT: "9464"
      METRICS_HOST: "0.0.0.0"
    ports:
      - "${API_PORT:-8000}:8000"
    expose:
      - "9464"
    volumes:
      - uploads:/app/backend/uploads
      - generated:/app/backend/generated
      - screenshots:/app/backend/artifacts/screenshots
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Assisted Apply's browser ships with the deployment by default.
        WITH_AUTOFILL: "${WITH_AUTOFILL:-1}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}
      ENVIRONMENT: production
      # A standalone worker must not run its own API; the API container never
      # runs pipelines. One place to look when a queue backs up.
      RUN_WORKER_IN_API: "false"
      # The API container owns schema changes: two processes running Alembic at
      # the same time is the classic "duplicate key on alembic_version" startup
      # failure. The worker waits for the API to be healthy before booting.
      AUTO_MIGRATE: "false"
      WORKER_CONCURRENCY: "2"
      # The worker exposes its own queue metrics on the same internal port
      # (scrape it as worker:9464).
      METRICS_PORT: "9464"
      METRICS_HOST: "0.0.0.0"
    expose:
      - "9464"
    volumes:
      - uploads:/app/backend/uploads
      - generated:/app/backend/generated
      - screenshots:/app/backend/artifacts/screenshots

  # Manual one-shot backup (kept for operator runs and pre-upgrade snapshots).
  # The absolute path matters: the image WORKDIR is /app, so
  # `python scripts/backup.py` would resolve to the nonexistent /app/scripts/.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Assisted Apply's browser ships with the deployment by default.
        WITH_AUTOFILL: "${WITH_AUTOFILL:-1}"
    profiles: ["ops"]
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "/app/backend/scripts/backup.py", "--out", "/backups", "--keep", "14"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}
      # A backup job must never touch the schema.
      AUTO_MIGRATE: "false"
      METRICS_PORT: "0"
    volumes:
      - backups:/backups

  # Automated backup: a tiny scheduler loop in the same image — no extra
  # packages, no host crontab required. It runs scripts/backup.py once the
  # stack is up and then every BACKUP_INTERVAL_SECONDS (default 24h), keeping
  # the newest BACKUP_KEEP generations (default 14) on the `backups` named
  # volume (same docker volume store as db-data). A failed run exits non-zero,
  # is logged to stderr, and the loop keeps going — so
  # `docker compose logs backup-scheduler` is where a broken backup shows up,
  # and the next tick retries it.
  backup-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Assisted Apply's browser ships with the deployment by default.
        WITH_AUTOFILL: "${WITH_AUTOFILL:-1}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        while :; do
          echo "backup-scheduler: starting backup at $$(date -u +%FT%TZ)"
          if python /app/backend/scripts/backup.py --out /backups --keep "$${BACKUP_KEEP:-14}"; then
            echo "backup-scheduler: ok, next run in $${BACKUP_INTERVAL_SECONDS:-86400}s"
          else
            echo "backup-scheduler: BACKUP FAILED (exit $$?) at $$(date -u +%FT%TZ)" >&2
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}
      # A backup job must never touch the schema.
      AUTO_MIGRATE: "false"
      METRICS_PORT: "0"
    volumes:
      - backups:/backups

volumes:
  db-data:
  uploads:
  generated:
  screenshots:
  backups:
